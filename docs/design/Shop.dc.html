<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Ronzino";src:url("/_blob/ec60cd3296323f23985077218873722e") format("woff2");font-weight:700}
@font-face{font-family:"BDO Grotesk";src:url("/_blob/8a391c23947730abf32d2056c2cefe7d") format("truetype");font-weight:300 900}
body{margin:0}
a{color:#B9A6FF}a:hover{color:#FFFFFF}
.pp-grid{position:absolute;inset:-48px;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:24px 24px;animation:pp-pan 18s linear infinite}
.pp-iri{position:absolute;inset:-48px;background:linear-gradient(115deg,#B9A6FF,#FF9AD5,#7FE7D9,#9C8CFF,#B9A6FF);background-size:300% 300%;-webkit-mask-image:linear-gradient(#000 1px,transparent 1px),linear-gradient(90deg,#000 1px,transparent 1px);-webkit-mask-size:24px 24px;mask-image:linear-gradient(#000 1px,transparent 1px),linear-gradient(90deg,#000 1px,transparent 1px);mask-size:24px 24px;opacity:.08;animation:pp-shift 9s ease-in-out infinite,pp-pan 18s linear infinite}
@keyframes pp-pan{to{transform:translate(24px,24px)}}
@keyframes pp-shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@media (prefers-reduced-motion: reduce){.pp-grid,.pp-iri{animation:none}}
input::placeholder{color:#A9A7B8}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0F; color: #F5F4FA; font-family: 'BDO Grotesk', sans-serif; display: flex; flex-direction: column">
  <div class="pp-grid" aria-hidden="true"></div>
  <div class="pp-iri" aria-hidden="true"></div>
  <div style="position: relative"><dc-import name="EventBar" hint-size="390px,112px"></dc-import></div>
  <main style="position: relative; flex-grow: 1; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 11px; font-weight: 900; letter-spacing: .14em; color: #A9A7B8">14 ITEMS / 212 IN STOCK</span>
        <h1 style="margin: 0; font-family: 'Ronzino', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05">Your shop</h1>
      </div>
      <button type="button" style="height: 48px; padding: 0 16px; border-radius: 16px; border: 0; background: #B9A6FF; color: #0B0B0F; font: 800 16px 'BDO Grotesk', sans-serif; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add item</button>
    </div>

    <label style="height: 36px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: #1C1C24; display: flex; align-items: center; gap: 8px; padding: 0 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9A7B8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search items</span>
      <input type="search" placeholder="Search items, tags, SKU" style="border: 0; outline: 0; flex-grow: 1; min-width: 0; font: 500 14px 'BDO Grotesk', sans-serif; background: #1C1C24; color: #F5F4FA">
    </label>

    <div role="group" aria-label="Filter" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 16px; background: #1C1C24; border: 1px solid rgba(255,255,255,.1)">
      <button type="button" aria-pressed="true" style="height: 40px; border-radius: 12px; border: 0; background: #7FE7D9; color: #0B0B0F; font: 800 13px 'BDO Grotesk', sans-serif">All</button>
      <button type="button" aria-pressed="false" style="height: 40px; border-radius: 12px; border: 0; background: #1C1C24; color: #F5F4FA; font: 700 13px 'BDO Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; background: #FF9AD5; color: #0B0B0F; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900">!</span>Low stock</button>
      <button type="button" aria-pressed="false" style="height: 40px; border-radius: 12px; border: 0; background: #1C1C24; color: #F5F4FA; font: 700 13px 'BDO Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; background: #7FE7D9; color: #0B0B0F; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900">+</span>Best margin</button>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
        <li style="border-radius: 18px; background: #1C1C24; border: 1px solid rgba(255,255,255,.1); padding: 10px 12px; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center">
          <div style="width: 48px; height: 48px; border-radius: 12px; background: {{item.tint}}" aria-hidden="true"></div>
          <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
              <strong style="font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.name}}</strong>
              <span style="font-family: 'Ronzino', sans-serif; font-weight: 700; font-size: 17px">{{item.price}}</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
              <span style="display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px 0 3px; border-radius: 999px; background: {{item.stockBg}}; color: {{item.stockFg}}; border: {{item.stockBorder}}; font-size: 11px; font-weight: 900; letter-spacing: .04em; box-sizing: border-box">
                <span style="width: 18px; height: 18px; border-radius: 50%; background: {{item.stockDotBg}}; color: {{item.stockDotFg}}; display: flex; align-items: center; justify-content: center; font-size: 11px">{{item.stockIcon}}</span>{{item.stock}}
              </span>
              <span style="display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px 0 3px; border-radius: 999px; background: {{item.marginBg}}; color: #0B0B0F; font-size: 11px; font-weight: 900; letter-spacing: .04em">
                <span style="width: 18px; height: 18px; border-radius: 50%; background: #0B0B0F; color: {{item.marginBg}}; display: flex; align-items: center; justify-content: center; font-size: 13px">{{item.marginIcon}}</span>{{item.margin}}
              </span>
            </div>
            <div style="height: 6px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden"><div style="height: 6px; width: {{item.stockPct}}; background: {{item.barColor}}"></div></div>
          </div>
        </li>
      </sc-for>
    </ul>
    <button type="button" style="height: 46px; flex-shrink: 0; border-radius: 16px; border: 1px dashed rgba(255,255,255,.3); background: #1C1C24; color: #F5F4FA; font: 700 15px 'BDO Grotesk', sans-serif">Import from CSV</button>
  </main>
  <div style="position: relative"><dc-import name="TabBar" active="shop" hint-size="390px,88px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { name: 'Cat sticker, holo', price: '$7', cost: 0.9, p: 7, stock: 3, max: 40 },
      { name: 'Frog pin', price: '$12', cost: 3.4, p: 12, stock: 18, max: 25 },
      { name: 'Mochi keychain', price: '$10', cost: 6.8, p: 10, stock: 21, max: 24 },
      { name: 'Art print A5', price: '$15', cost: 2.1, p: 15, stock: 9, max: 20 },
      { name: 'Sticker pack of 5', price: '$20', cost: 4.5, p: 20, stock: 2, max: 15 }
    ];
    const tints = ['linear-gradient(145deg,#D9CCFF,#FFD6EE)', 'linear-gradient(145deg,#CFF6F0,#D9CCFF)', 'linear-gradient(145deg,#FFD6EE,#CFF6F0)'];
    const items = rows.map((r, i) => {
      const margin = Math.round(((r.p - r.cost) / r.p) * 100);
      const low = r.stock <= 3;
      const good = margin >= 60;
      return {
        name: r.name,
        price: r.price,
        tint: tints[i % tints.length],
        stock: low ? r.stock + ' LEFT' : r.stock + ' IN STOCK',
        stockIcon: low ? '!' : '#',
        stockBg: low ? '#FF9AD5' : '#24242E',
        stockFg: low ? '#0B0B0F' : '#F5F4FA',
        stockBorder: low ? '0' : '1px solid rgba(255,255,255,.22)',
        stockDotBg: low ? '#0B0B0F' : '#34343F',
        stockDotFg: low ? '#FF9AD5' : '#F5F4FA',
        margin: margin + '% MARGIN',
        marginIcon: good ? '+' : '-',
        marginBg: good ? '#7FE7D9' : '#D9CCFF',
        stockPct: Math.round((r.stock / r.max) * 100) + '%',
        barColor: low ? '#FF9AD5' : '#B9A6FF'
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
