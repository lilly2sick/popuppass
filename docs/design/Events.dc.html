<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Events sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Ronzino";src:url("/_blob/ec60cd3296323f23985077218873722e") format("woff2");font-weight:700}
@font-face{font-family:"BDO Grotesk";src:url("/_blob/8a391c23947730abf32d2056c2cefe7d") format("truetype");font-weight:300 900}
body{margin:0}
input::placeholder{color:#A9A7B8}
a{color:#B9A6FF}a:hover{color:#FFFFFF}
.pp-grid{position:absolute;inset:-48px;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:24px 24px;animation:pp-pan 18s linear infinite}
.pp-iri{position:absolute;inset:-48px;background:linear-gradient(115deg,#B9A6FF,#FF9AD5,#7FE7D9,#9C8CFF,#B9A6FF);background-size:300% 300%;-webkit-mask-image:linear-gradient(#000 1px,transparent 1px),linear-gradient(90deg,#000 1px,transparent 1px);-webkit-mask-size:24px 24px;mask-image:linear-gradient(#000 1px,transparent 1px),linear-gradient(90deg,#000 1px,transparent 1px);mask-size:24px 24px;opacity:.08;animation:pp-shift 9s ease-in-out infinite,pp-pan 18s linear infinite}
@keyframes pp-pan{to{transform:translate(24px,24px)}}
@keyframes pp-shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@media (prefers-reduced-motion: reduce){.pp-grid,.pp-iri{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0F; color: #F5F4FA; font-family: 'BDO Grotesk', sans-serif">
  <div class="pp-grid" aria-hidden="true"></div>
  <div class="pp-iri" aria-hidden="true"></div>
  <div style="position: absolute; inset: 0; background: rgba(11,11,15,.6)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="evTitle" style="position: absolute; left: 0; right: 0; bottom: 0; height: 768px; box-sizing: border-box; background: #15151B; border-top: 1px solid rgba(255,255,255,.16); border-radius: 28px 28px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 44px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); align-self: center" aria-hidden="true"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 id="evTitle" style="margin: 0; font-family: 'Ronzino', sans-serif; font-weight: 700; font-size: 28px">Your events</h1>
      <a href="Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; color: #F5F4FA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <label style="height: 36px; flex-shrink: 0; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: #1C1C24; display: flex; align-items: center; gap: 8px; padding: 0 14px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9A7B8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
      <input type="search" placeholder="Search events and cons" style="border: 0; outline: 0; flex-grow: 1; min-width: 0; font: 500 14px 'BDO Grotesk', sans-serif; background: #1C1C24; color: #F5F4FA">
    </label>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{mine}}" as="e" hint-placeholder-count="3">
        <li style="border-radius: 18px; padding: {{e.pad}}; background: {{e.ring}}">
          <div style="border-radius: 17px; background: #1C1C24; padding: 10px 12px; display: flex; align-items: center; gap: 12px">
            <div style="width: 54px; height: 54px; flex-shrink: 0; border-radius: 14px; background: linear-gradient(160deg,#D9CCFF,#FFD6EE 55%,#CFF6F0); color: #0B0B0F; display: flex; flex-direction: column; align-items: center; justify-content: center">
              <span style="font-size: 10px; font-weight: 900; letter-spacing: .1em">{{e.month}}</span>
              <span style="font-family: 'Ronzino', sans-serif; font-weight: 700; font-size: 18px; line-height: 1">{{e.days}}</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
              <strong style="font-size: 16px">{{e.name}}</strong>
              <span style="font-size: 12px; color: #A9A7B8">{{e.meta}}</span>
            </div>
            <span style="font-size: 10px; font-weight: 900; letter-spacing: .12em; padding: 4px 8px; border-radius: 999px; background: {{e.tagBg}}; color: {{e.tagFg}}">{{e.tag}}</span>
          </div>
        </li>
      </sc-for>
    </ul>

    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Ronzino', sans-serif; font-weight: 700; font-size: 20px">Cons near you</h2>
      <span style="font-size: 10px; font-weight: 900; letter-spacing: .12em; color: #A9A7B8">VIA ANIMECONS.COM</span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{near}}" as="n" hint-placeholder-count="3">
        <li style="border-radius: 16px; background: #1C1C24; border: 1px solid rgba(255,255,255,.08); padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px">
          <div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1">
            <strong style="font-size: 15px">{{n.name}}</strong>
            <span style="font-size: 12px; color: #A9A7B8">{{n.meta}}</span>
          </div>
          <button type="button" aria-label="{{n.aria}}" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #7FE7D9; color: #0B0B0F; font: 800 14px 'BDO Grotesk', sans-serif">Add</button>
        </li>
      </sc-for>
    </ul>
    <p style="margin: 0; font-size: 12px; color: #A9A7B8">Distance is worked out on your phone. Your location is never sent anywhere.</p>

    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 48px; border-radius: 14px; border: 0; background: #B9A6FF; color: #0B0B0F; font: 800 14px 'BDO Grotesk', sans-serif">New event</button>
      <button type="button" style="height: 48px; border-radius: 14px; border: 1px solid rgba(255,255,255,.22); background: #24242E; color: #F5F4FA; font: 700 14px 'BDO Grotesk', sans-serif">Import .ics</button>
      <button type="button" style="height: 48px; border-radius: 14px; border: 1px solid rgba(255,255,255,.22); background: #24242E; color: #F5F4FA; font: 700 14px 'BDO Grotesk', sans-serif">Export</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mine = [
      { month: 'NOV', days: '6-8', name: 'Anime Fest 2026', meta: 'Booth A-14 / $120 booth', tag: 'LIVE', state: 'live' },
      { month: 'DEC', days: '12', name: 'Winter Makers Market', meta: 'Table 31 / $45 booth', tag: 'IN 39 D', state: 'soon' },
      { month: 'OCT', days: '17-18', name: 'Kawaii Con', meta: '+$286 net / 58 sold', tag: 'DONE', state: 'done' }
    ].map((e) => Object.assign({}, e, {
      ring: e.state === 'live' ? 'linear-gradient(115deg,#B9A6FF,#FF9AD5,#7FE7D9)' : 'rgba(255,255,255,.08)',
      pad: '1px',
      tagBg: e.state === 'live' ? '#7FE7D9' : e.state === 'soon' ? '#D9CCFF' : '#2E2E38',
      tagFg: e.state === 'done' ? '#F5F4FA' : '#0B0B0F'
    }));
    const near = [
      { name: '[CON NAME FROM FEED]', meta: 'Jan 16-18 / 12 mi' },
      { name: '[CON NAME FROM FEED]', meta: 'Feb 6-8 / 40 mi' },
      { name: '[CON NAME FROM FEED]', meta: 'Mar 20-22 / 85 mi' }
    ].map((n) => Object.assign({}, n, { aria: 'Add ' + n.name }));
    return { mine, near };
  }
}
</script>
</body>
</html>
