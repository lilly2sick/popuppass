<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Ronzino";src:url("/_blob/ec60cd3296323f23985077218873722e") format("woff2");font-weight:700}
@font-face{font-family:"BDO Grotesk";src:url("/_blob/8a391c23947730abf32d2056c2cefe7d") format("truetype");font-weight:300 900}
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 390px; height: 88px; box-sizing: border-box; padding: 8px 12px 16px; background: #15151B; border-top: 1px solid rgba(255,255,255,.12); font-family: 'BDO Grotesk', sans-serif; color: #F5F4FA; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end">
  <a href="Home.dc.html" aria-current="{{home.current}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{home.color}}; font-size: 12px; font-weight: {{home.weight}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"></path></svg>Home
  </a>
  <a href="Shop.dc.html" aria-current="{{shop.current}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{shop.color}}; font-size: 12px; font-weight: {{shop.weight}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12l-8 8-8-8V4h8z"></path><circle cx="8" cy="8" r="1.5"></circle></svg>Shop
  </a>
  <a href="Sell.dc.html" aria-current="{{sell.current}}" aria-label="Sell" style="height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-decoration: none">
    <span style="width: 64px; height: 64px; border-radius: 22px; background: {{sell.bg}}; box-shadow: 0 0 24px {{sell.glow}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #0B0B0F; font-family: 'Ronzino', sans-serif; font-weight: 700; font-size: 13px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Sell
    </span>
  </a>
  <a href="Create.dc.html" aria-current="{{create.current}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{create.color}}; font-size: 12px; font-weight: {{create.weight}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M4 15l4-4 4 4 3-3 5 5"></path></svg>Create
  </a>
  <a href="Insights.dc.html" aria-current="{{insights.current}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{insights.color}}; font-size: 12px; font-weight: {{insights.weight}}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"></path></svg>Insights
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","shop","sell","create","insights"],"default":"home"},"$preview":{"width":390,"height":88}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const tab = (id) => ({
      current: active === id ? 'page' : 'false',
      color: active === id ? '#B9A6FF' : '#A9A7B8',
      weight: active === id ? '800' : '500'
    });
    return {
      home: tab('home'),
      shop: tab('shop'),
      create: tab('create'),
      insights: tab('insights'),
      sell: {
        current: active === 'sell' ? 'page' : 'false',
        bg: active === 'sell' ? '#B9A6FF' : '#FF9AD5',
        glow: active === 'sell' ? 'rgba(185,166,255,.55)' : 'rgba(255,154,213,.35)'
      }
    };
  }
}
</script>
</body>
</html>
