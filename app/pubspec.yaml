name: popup_pass
description: Phone-first toolkit for convention artists and pop-up vendors.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # app
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.19.0

  # local data (source of truth)
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  path_provider: ^2.1.6
  uuid: ^4.6.0

  # network, identity, purchases
  dio: ^5.11.1
  crypto: ^3.0.8
  connectivity_plus: ^6.1.5
  flutter_secure_storage: ^9.2.4
  supabase_flutter: ^2.18.3
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^6.3.0
  purchases_flutter: ^8.11.0

  # ui
  flutter_card_swiper: ^7.2.0
  flutter_svg: ^2.3.2
  gal: ^2.3.3 # save PNGs to Photos / Gallery
  fl_chart: ^0.70.2
  image_picker: ^1.2.4
  file_picker: ^8.3.7
  share_plus: ^10.1.4

  # exports
  csv: ^6.0.0
  excel: ^4.0.6
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.31.0

flutter:
  uses-material-design: true
  assets:
    - assets/pup.svg
  # Brand fonts, bundled so they work offline (both OFL; licenses alongside).
  fonts:
    - family: Ronzino
      fonts:
        - asset: assets/fonts/Ronzino-Regular.otf
          weight: 400
        - asset: assets/fonts/Ronzino-Medium.otf
          weight: 500
        - asset: assets/fonts/Ronzino-Bold.otf
          weight: 700
    - family: BDOGrotesk
      fonts:
        - asset: assets/fonts/BDO-Grotesk-VF.ttf
